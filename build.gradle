buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-1.20.1"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            // Dependency mixins (Architectury, KubeJS, Thaumcraft 4R, GregTech CEu)
            // ship SRG refmaps; dev runs must remap them against the MCP mapping file.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            workingDirectory project.file('run-client')
            property 'forge.enabledGameTestNamespaces', mod_id
            if (project.hasProperty('clientSmokeTest')) {
                property 'pollution.clientSmokeTest', 'true'
                args '--quickPlayMultiplayer', '127.0.0.1:25599', '--username', 'PollutionTester', '--width', '960', '--height', '540'
            }
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            workingDirectory project.file('run-gametest')
            property 'forge.enabledGameTestNamespaces', mod_id
            property 'forge.logging.console.level', 'info'
        }

        data {
            workingDirectory project.file('run-data')
            property 'forge.logging.console.level', 'info'
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/'), '--existing-mod', 'gtceu'
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// LDLib's published POM lists AE2 as an optional runtime integration. Its
// broken 15.0.4-beta coordinates are pulled into ForgeGradle's __obfuscated
// graph (which resolves in full before it can deobfuscate anything), so the
// module is excluded on the LDLib dependency itself. The exclude lives inside
// fg.deobf(...) because that is what gets copied onto the __obfuscated
// dependency; a configuration-wide exclude would also strip the explicit AE2
// dependency declared below and no deobf jar would ever be generated for it.

// Work around unreliable TLS to repo.maven.apache.org on this network:
// transparently redirect every Maven Central repository (including the ones
// ForgeGradle adds) to the Aliyun mirror.
allprojects {
    repositories.configureEach { repo ->
        if (repo instanceof MavenArtifactRepository) {
            def repoUrl = repo.url.toString()
            if (repoUrl.startsWith('https://repo.maven.apache.org') || repoUrl.startsWith('https://repo1.maven.org')) {
                repo.setUrl('https://maven.aliyun.com/repository/public')
            }
        }
    }
}

repositories {
    maven {
        name = 'LocalPorts'
        url = uri('local-repo')
    }
    maven {
        name = 'Aliyun'
        url = 'https://maven.aliyun.com/repository/public'
    }
    maven {
        name = 'GTCEu'
        url = 'https://maven.gtceu.com'
    }
    maven {
        name = 'FirstDarkDev'
        url = 'https://maven.firstdark.dev/snapshots'
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
    }
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev/'
    }
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
    }
    maven {
        name = 'KubeJS'
        url = 'https://maven.latvian.dev/releases'
    }
    maven {
        name = 'Architectury'
        url = 'https://maven.architectury.dev/'
    }
    maven {
        name = 'Tterrag'
        url = 'https://maven.tterrag.com/'
    }
    maven {
        name = 'TerraBlender'
        url = 'https://maven.minecraftforge.net/'
    }
}

dependencies {
    compileOnly 'org.jetbrains:annotations:26.0.2'
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // All mod dependencies are resolved without their transitive graphs:
    // published mod POMs declare optional integrations (AE2, Create, ...)
    // that are not on the compile classpath and would break resolution.
    // Everything actually needed is declared explicitly below.

    // Thaumcraft 4R 1.20.1 reconstruction (local dev jar from local-repo/)
    compileOnly(fg.deobf("dev.tc4port:thaumcraft-forge:${thaumcraft_version}")) { transitive = false }
    runtimeOnly(fg.deobf("dev.tc4port:thaumcraft-forge:${thaumcraft_version}")) { transitive = false }

    // Thaumcraft 4R addon ports (local-repo/): forbidden magic, tainted magic,
    // thaumic tinkerer. Thaumic Energistics is compile-only below because its
    // 20711 runtime calls an object-aspect helper removed by the 20719 API.
    for (addon in ['forbidden-magic', 'tainted-magic', 'thaumic-tinkerer']) {
        compileOnly(fg.deobf("dev.tc4port:${addon}:${tc_addons_version}")) { transitive = false }
        runtimeOnly(fg.deobf("dev.tc4port:${addon}:${tc_addons_version}")) { transitive = false }
    }
    // 20719 does not ship Thaumic Energistics; retain its API for source
    // compatibility, but do not load the incompatible 20711 runtime jar.
    compileOnly(fg.deobf("dev.tc4port:thaumic-energistics:${thaumic_energistics_version}")) { transitive = false }

    // Curios / TerraBlender: runtime dependencies of Thaumcraft 4R
    compileOnly(fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}:api")) { transitive = false }
    runtimeOnly(fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")) { transitive = false }
    runtimeOnly(fg.deobf("com.github.glitchfiend:TerraBlender-forge:${terrablender_version}")) { transitive = false }

    // GregTech CEu Modern addon API
    compileOnly(fg.deobf("com.gregtechceu.gtceu:gtceu-1.20.1:${gtceu_version}")) { transitive = false }
    runtimeOnly(fg.deobf("com.gregtechceu.gtceu:gtceu-1.20.1:${gtceu_version}")) { transitive = false }
    // Compile-time only: GTCEu publishes LDLib and Registrate through its own
    // jarJar bundle. Adding them as runtimeOnly duplicates the modules and breaks
    // the FML module layer (ResolutionException: ... export package ...).
    compileOnly(fg.deobf("com.lowdragmc.ldlib:ldlib-forge-1.20.1:${ldlib_version}", {
        exclude group: 'appeng', module: 'appliedenergistics2-forge'
    })) { transitive = false }
    compileOnly(fg.deobf("com.tterrag.registrate:Registrate:${registrate_version}")) { transitive = false }

    // JEI
    compileOnly(fg.deobf("mezz.jei:jei-1.20.1-common-api:${jei_version}")) { transitive = false }
    compileOnly(fg.deobf("mezz.jei:jei-1.20.1-forge-api:${jei_version}")) { transitive = false }
    // forge impl is compileOnly too: FluidHelperCompatMixin targets a class inside it
    compileOnly(fg.deobf("mezz.jei:jei-1.20.1-forge:${jei_version}")) { transitive = false }
    // Exercise the supported JEI runtime and compatibility mixins in development.
    runtimeOnly(fg.deobf("mezz.jei:jei-1.20.1-forge:${jei_version}")) { transitive = false }

    // Botania
    compileOnly(fg.deobf("vazkii.botania:Botania:${botania_version}")) { transitive = false }
    runtimeOnly(fg.deobf("vazkii.botania:Botania:${botania_version}")) { transitive = false }

    // Applied Energistics 2
    compileOnly(fg.deobf("appeng:appliedenergistics2-forge:${ae2_version}")) { transitive = false }
    runtimeOnly(fg.deobf("appeng:appliedenergistics2-forge:${ae2_version}")) { transitive = false }

    // Patchouli: mandatory dependency of Botania in the target pack
    compileOnly(fg.deobf("vazkii.patchouli:Patchouli:${patchouli_version}")) { transitive = false }
    runtimeOnly(fg.deobf("vazkii.patchouli:Patchouli:${patchouli_version}")) { transitive = false }

    // GuideME: guide library shipped in the target pack (GTCEu/AE2 ecosystem)
    compileOnly(fg.deobf("org.appliedenergistics:guideme:${guideme_version}")) { transitive = false }
    runtimeOnly(fg.deobf("org.appliedenergistics:guideme:${guideme_version}")) { transitive = false }

    // GTNN ("GT--") and GCYR (Gregicality Rocketry), both shipped in the target
    // modpack; local jars installed under local-repo/local/.
    compileOnly(fg.deobf("local.gtnn:gtnn:${gtnn_version}")) { transitive = false }
    runtimeOnly(fg.deobf("local.gtnn:gtnn:${gtnn_version}")) { transitive = false }
    compileOnly(fg.deobf("local.gcyr:gcyr:${gcyr_version}")) { transitive = false }
    runtimeOnly(fg.deobf("local.gcyr:gcyr:${gcyr_version}")) { transitive = false }

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // KubeJS: recipe removal / addition scripting
    compileOnly(fg.deobf("dev.latvian.mods:kubejs-forge:${kubejs_version}")) { transitive = false }
    compileOnly(fg.deobf("dev.latvian.mods:rhino-forge:${rhino_version}")) { transitive = false }
    // KubeJS ConsoleJS retains a non-daemon logging executor after datagen ends.
    // Static resources need no scripts; normal game runs still include KubeJS.
    if (!gradle.startParameter.taskNames.any { it.tokenize(':').last() == 'runData' }) {
        runtimeOnly(fg.deobf("dev.latvian.mods:kubejs-forge:${kubejs_version}")) { transitive = false }
    }
    runtimeOnly(fg.deobf("dev.latvian.mods:rhino-forge:${rhino_version}")) { transitive = false }
    runtimeOnly(fg.deobf("dev.architectury:architectury-forge:${architectury_version}")) { transitive = false }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
            thaumcraft_version: thaumcraft_version, tc_addons_version: tc_addons_version,
            thaumic_energistics_version: thaumic_energistics_version, gtceu_version: gtceu_version,
    ]
    inputs.properties replaceProperties
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    exclude 'meowmel/pollution/gametest/**'
    exclude 'meowmel/pollution/compat/jei/ClientSmokeJeiHook.class'
    exclude 'data/pollution/structures/platform.nbt', 'data/pollution/structures/machine_lab.nbt'
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : 'pollution.mixins.json'
        ])
    }

    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
