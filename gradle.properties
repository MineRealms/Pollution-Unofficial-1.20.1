## Dependency Versions

# Thaumcraft 4R (local dev jar in local-repo/, see local-repo/README.md)
thaumcraft_version=0.1.0-20719
# Thaumcraft 4R addon ports (forbidden-magic / tainted-magic / thaumic-energistics / thaumic-tinkerer)
tc_addons_version=0.1.0-20719
# Thaumic Energistics was not included in the 20719 ZIP; keep its existing local build.
thaumic_energistics_version=0.1.0-20711

# GregTech CEu Modern
# PIN 7.5.3: this is what the target server actually runs. The JEI 15.59 conflict is
# handled by our own FluidHelperCompatMixin shim, so no 8.0.0 upgrade is needed.
gtceu_version=7.5.3
ldlib_version=1.0.40.b
registrate_version=MC1.20-1.3.11

# Runtime dependencies of Thaumcraft 4R
curios_version=5.14.1+1.20.1
terrablender_version=1.20.1-3.0.1.10

# Recipe viewer / scripting (aligned with the target modpack "Society Sunlit Valley")
jei_version=15.56.0.205
kubejs_version=2001.6.5-build.16
rhino_version=2001.2.3-build.10
architectury_version=9.2.14

# GTNN ("GT--") and GCYR (Gregicality Rocketry): both present in the target pack
gtnn_version=1.3.10
gcyr_version=0.2.9

# Botania / AE2 aligned with the target pack
botania_version=1.20.1-456-FORGE
ae2_version=15.4.10
# Patchouli: mandatory dependency of Botania (target pack ships 1.20.1-85)
patchouli_version=1.20.1-85-FORGE
# GuideME: guide library required by GTCEu/AE2 in the target pack
guideme_version=20.1.14

